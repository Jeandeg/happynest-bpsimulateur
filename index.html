<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HappyNest — accès protégé</title>
<style>
:root { color-scheme: light; --bg: #f7f6f2; --panel: #fff; --fg: #1f1e1c; --muted: #6b6963; --line: #e3e1da; --bad: #c03a2b; --acc: #1f1e1c; --accfg: #fff; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #191917; --panel: #232321; --fg: #ecebe6; --muted: #a3a097; --line: #3a3936; --bad: #ef6f62; --acc: #ecebe6; --accfg: #191917; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
.box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 24px; margin: 0 0 6px; }
p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.45; }
label { display: block; font-size: 13px; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button { margin-top: 14px; width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--acc); color: var(--accfg); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
